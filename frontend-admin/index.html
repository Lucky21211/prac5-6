<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ панель</title>
</head>
<body>
    <h1>Управление товарами</h1>
    <input type="text" id="name" placeholder="Название">
    <input type="text" id="price" placeholder="Стоимость">
    <input type="text" id="description" placeholder="Описание">
    <button onclick="addProduct()">Добавить товар</button>
    
    <h2>Список товаров</h2>
    <ul id="adminProductList"></ul>

    <script>
        function loadProducts() {
            fetch('http://localhost:3000/products')
                .then(res => res.json())
                .then(products => {
                    document.getElementById('productList').innerHTML = products.map(p => `<li>${p.name} - ${p.price}</li>`).join('');
                });
        }

        function addProduct() {
            const product = {
                name: document.getElementById('name').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value
            };

            fetch('http://localhost:3000/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            }).then(() => {
                loadProducts();
                fetch('http://localhost:8080/update'); // Обновление магазина
            });
        }

        loadProducts();
    </script>

<div id="products"></div>

<h2>Чат поддержки</h2>
<div id="chatWindow" style="border: 1px solid #ccc; height: 200px; overflow-y: auto; margin-bottom: 10px; padding: 10px;"></div>
<input type="text" id="messageInput" placeholder="Введите сообщение...">
<button onclick="sendMessage()">Отправить</button>


</body>
</html>
